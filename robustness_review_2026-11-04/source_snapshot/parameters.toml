[scaling_laws.lstm]
# L(C) = A * C^alpha
A = 3.8939e+01
alpha = -0.0667


[scaling_laws.transformer_2017]
# Retro / Kaplan-era transformer scaling constants.
A = 7.5151e+01
alpha = -0.0890

[scaling_laws.modern_transformer]
# Modern transformer scaling constants.
A = 8.5647e+01
alpha = -0.0934

[compute_frontier]
yearly_scaling_multiplier = 4.1
y0 = 2013.0
C0 = 1.0e16

[chinchilla_rebalancing]
coefficient = 1.85e-20
term1_coefficient = 28737.9
term1_exponent = -0.2482
term2_coefficient = 20.337
term2_exponent = -0.0756
outer_exponent = 6.512

[innovation_multipliers]
learned_to_rotary = 1.26
post_to_pre_norm = 1.87
sqrt_to_cosine_scheduler = 1.04
pre_to_rms = 1.09
sinusoidal_to_rotary = 1.44
gelu_to_swiglu = 1.17
mixture_of_experts = 2.0

[interaction_normalization]
enabled = true
total = 1.33

[sensitivity]
# Optional one-off adjustment applied when importing constants.py.
# Keep at 0 for the baseline. A value of 0.25 makes the
# alpha_TM - alpha_L gap 25% larger; -0.25 makes it 25% smaller.
deviation = 0.0

[algorithmic_progress_types]
# Toy parameters for figures/algorithmic_progress_types.png.
baseline_A = 1.0
baseline_alpha = 0.35
steeper_A = 1.0
steeper_alpha = 0.55
shift_factor = 0.6
C_min = 1.0
C_max = 1.0e4
num_points = 400








